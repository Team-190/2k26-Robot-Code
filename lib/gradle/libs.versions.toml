
[versions]
wpilib = "2027.0.0-alpha-7"
wpilib-jni = "2027.0.0-alpha-7"
phoenix6 = "26.70.0-alpha-2"
# choreo = "2027.0.0-alpha-3" # Now WPILib 2027 alpha-7 compatible; re-enable once confirmed.
aspectj = "1.9.25.1"
advantagekit = "27.0.0-alpha-6"
quickbuf = "1.4"
jackson = "2.22.3"
# jackson-annotations dropped its patch digit at 2.20+ (2.22, not 2.22.x) while core/databind kept theirs.
jackson-annotations = "2.22"
pathplanner = "2027.0.0-alpha-4.1"
# Runtime dependency of wpilib-tunables (TunableConfig properties); matches what GradleRIO resolves.
avaje-jsonb = "3.14"

[libraries]
# WPILib Core -- groupId moved from edu.wpi.first.* to org.wpilib.* for the 2027 season.
wpilib-wpilibj = { group = "org.wpilib.wpilibj", name = "wpilibj-java", version.ref = "wpilib" }
wpilib-wpimath = { group = "org.wpilib.wpimath", name = "wpimath-java", version.ref = "wpilib" }
wpilib-ntcore = { group = "org.wpilib.ntcore", name = "ntcore-java", version.ref = "wpilib" }
wpilib-wpinet = { group = "org.wpilib.wpinet", name = "wpinet-java", version.ref = "wpilib" }
wpilib-cscore = { group = "org.wpilib.cscore", name = "cscore-java", version.ref = "wpilib" }
wpilib-cameraserver = { group = "org.wpilib.cameraserver", name = "cameraserver-java", version.ref = "wpilib" }
wpilib-wpiutil = { group = "org.wpilib.wpiutil", name = "wpiutil-java", version.ref = "wpilib" }
wpilib-wpiunits = { group = "org.wpilib.wpiunits", name = "wpiunits-java", version.ref = "wpilib" }
# WPILibNewCommands was replaced by the standalone Commands V2 vendordep/artifact in 2027.
wpilib-commands = { group = "org.wpilib.commandsv2", name = "commandsv2-java", version.ref = "wpilib" }
wpilib-hal = { group = "org.wpilib.hal", name = "hal-java", version.ref = "wpilib" }
wpilib-apriltag = {group = "org.wpilib.apriltag", name="apriltag-java", version.ref = "wpilib"}
wpilib-fields = { group = "org.wpilib.fields", name = "fields-java", version.ref = "wpilib" }
wpilib-telemetry = { group = "org.wpilib.telemetry", name = "telemetry-java", version.ref = "wpilib" }
wpilib-tunables = { group = "org.wpilib.tunables", name = "tunables-java", version.ref = "wpilib" }
# DriverStationBackend.startDataLog(DataLog) is on the classpath transitively at the bytecode
# level even when unused, so Mockito's mockStatic() fails to load the class without this present.
wpilib-datalog = { group = "org.wpilib.datalog", name = "datalog-java", version.ref = "wpilib" }

# WPILib native libs -- the old "-jni" jar artifacts were replaced by "-cpp" classified zips.
wpilib-ntcore-jni = { group = "org.wpilib.ntcore", name = "ntcore-cpp", version.ref = "wpilib-jni" }
wpilib-wpiutil-jni = { group = "org.wpilib.wpiutil", name = "wpiutil-cpp", version.ref = "wpilib-jni" }
wpilib-hal-jni = { group = "org.wpilib.hal", name = "hal-cpp", version.ref = "wpilib-jni" }

# CTRE Phoenix 6/Pro
phoenix6 = { group = "com.ctre.phoenix6", name = "wpiapi-java", version.ref = "phoenix6" }

# Choreo (no WPILib 2027 alpha compatible release yet; see [versions])
# choreo = { group = "choreo", name = "ChoreoLib-java", version.ref = "choreo" }

# PathplannerLib
pathplanner = { group = "com.pathplanner.lib", name = "PathplannerLib-java", version.ref = "pathplanner" }

# AspectJ
aspectj-rt = { group = "org.aspectj", name = "aspectjrt", version.ref = "aspectj" }
aspectj-tools = { group = "org.aspectj", name = "aspectjtools", version.ref = "aspectj" }

# AdvantageKit
advantagekit-java = { group = "org.littletonrobotics.akit", name = "akit-java", version.ref = "advantagekit" }
advantagekit-autolog = { group = "org.littletonrobotics.akit", name = "akit-autolog", version.ref = "advantagekit" }

# QuickBuf / Jackson (runtime dependencies needed for generated code)
quickbuf = { group = "us.hebi.quickbuf", name = "quickbuf-runtime", version.ref = "quickbuf" }
jackson-annotations = { group = "com.fasterxml.jackson.core", name = "jackson-annotations", version.ref = "jackson-annotations" }
jackson-core = { group = "com.fasterxml.jackson.core", name = "jackson-core", version.ref = "jackson" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
avaje-jsonb = { group = "io.avaje", name = "avaje-jsonb", version.ref = "avaje-jsonb" }

[bundles]
wpilib = [
    "wpilib-wpilibj",
    "wpilib-wpimath",
    "wpilib-ntcore",
    "wpilib-wpinet",
    "wpilib-cscore",
    "wpilib-cameraserver",
    "wpilib-wpiutil",
    "wpilib-wpiunits",
    "wpilib-commands",
    "wpilib-hal",
    "wpilib-apriltag",
    "wpilib-fields",
    "wpilib-telemetry",
    "wpilib-tunables",
    "avaje-jsonb",
    "wpilib-datalog"
]

wpilib-runtime = [
    "wpilib-ntcore-jni",
    "wpilib-wpiutil-jni",
    "wpilib-hal-jni"
]

aspectj =  [
    "aspectj-rt",
    "aspectj-tools"
]

advantagekit = [
    "advantagekit-java",
    "advantagekit-autolog",
    "quickbuf",
    "jackson-annotations",
    "jackson-core",
    "jackson-databind"
]
