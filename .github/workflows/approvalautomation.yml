name: LCM Review Automation

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

jobs:
  lcm-review-check:
    name: LCM Review Check
    runs-on: ubuntu-latest

    steps:
      - name: Determine action for this PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.APPROVAL_PAT }}
          script: |
            const pr = context.payload.pull_request;
            const prAuthor = pr.user.login;
            const prNumber = pr.number;

            console.log(`PR #${prNumber} by ${prAuthor}`);

            // -----------------------------
            // CASE 1: ElliotScher authored PR
            // -----------------------------
            if (prAuthor === 'ElliotScher') {
              console.log("Auto-approving PR (author is ElliotScher)");

              try {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  event: 'APPROVE'
                });

                console.log("Approval submitted");
              } catch (err) {
                console.error("Failed to approve PR:", err);
              }

              return; // IMPORTANT: stop here so no review is requested
            }

            // -----------------------------
            // CASE 2: Other authors
            // -----------------------------
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const alreadyRequested = pr.requested_reviewers
              .map(r => r.login)
              .includes('ElliotScher');

            if (!alreadyRequested) {
              console.log("Requesting review from ElliotScher");

              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  reviewers: ['ElliotScher']
                });

                console.log("Review requested");
              } catch (err) {
                console.error("Failed to request review:", err);
              }
            } else {
              console.log("ElliotScher already requested as reviewer");
            }